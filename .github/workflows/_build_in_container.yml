name: ~Build wheel template

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner to use for the build"
        required: true
        type: string
      container-image:
        description: "Container image"
        required: true
        type: string
      upload-to-release:
        description: "Save wheel for release upload"
        required: false
        type: boolean
        default: false
      artifact-name:
        type: string
        default: container-wheels
      release-version:
        description: "Upload wheel to this release"
        required: false
        type: string

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

# Inherit caller permissions; scheduled builds remain read-only.

jobs:
  build-wheel:
    runs-on: ${{ inputs.runs-on }}
    name: Build wheel (${{ inputs.container-image }})
    steps:
      - name: Move /var/lib/containerd/
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/docker/containerd"
          sudo mv /var/lib/containerd/ "${GITHUB_WORKSPACE}/docker/containerd"

      - name: Move /var/lib/containerd/
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/docker/docker"
          sudo mv /var/lib/docker/ "${GITHUB_WORKSPACE}/docker/docker"

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 5120
          temp-reserve-mb: 32
          swap-size-mb: 10240
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/"

      - name: Restore /var/lib/containerd/
        run: |-
          sudo sh -c "mv ${GITHUB_WORKSPACE}/docker/containerd/* /var/lib/containerd"


      - name: Restore /var/lib/docker/
        run: |-
          sudo sh -c "mv ${GITHUB_WORKSPACE}/docker/docker/* /var/lib/docker"


      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-version }}
          submodules: recursive
          persist-credentials: false
      - name: Checkout build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build-scripts/
          persist-credentials: false
      - name: Build
        run: |
          echo "Free space:"
          df -h

      - name: Pull the container
        run: |-
          docker pull "${CI_INPUTS_CONTAINER_IMAGE}"


        env:
          CI_INPUTS_CONTAINER_IMAGE: ${{ inputs.container-image }}
      - name: Set CUDA and PyTorch versions
        run: |
          cat <<'EOF' >> script.sh
          #!/bin/bash

          set -eoxu pipefail

          echo "MATRIX_CUDA_VERSION=$(echo $CUDA_VERSION | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          echo "MATRIX_TORCH_VERSION=$NVIDIA_PYTORCH_VERSION" >> $GITHUB_ENV
          echo "WHEEL_CUDA_VERSION=$(echo $CUDA_VERSION | awk -F \. {'print $1'})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(python -c "import sys; print('{}.{}'.format(sys.version_info[0], sys.version_info[1]))" | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          echo "CXX11_ABI=$(python -c 'import torch; print(str(torch._C._GLIBCXX_USE_CXX11_ABI).upper())')" >> $GITHUB_ENV

          cat $GITHUB_ENV
          EOF

          docker run \
            --rm \
            --shm-size=64g \
            --workdir /workspace \
            --volume "$PWD:/workspace" \
            --volume "$GITHUB_ENV:$GITHUB_ENV" \
            -e GITHUB_ENV="$GITHUB_ENV" \
            "${CI_INPUTS_CONTAINER_IMAGE}" bash /workspace/script.sh

        env:
          CI_INPUTS_CONTAINER_IMAGE: ${{ inputs.container-image }}
      - name: Build wheel
        id: build_wheel
        env:
          CXX11_ABI: ${{ env.CXX11_ABI }}
          MATRIX_TORCH_VERSION: ${{ env.MATRIX_TORCH_VERSION}}
          WHEEL_CUDA_VERSION: ${{ env.WHEEL_CUDA_VERSION }}
          MATRIX_PYTHON_VERSION: ${{ env.MATRIX_PYTHON_VERSION }}
          CI_INPUTS_CONTAINER_IMAGE: ${{ inputs.container-image }}
        run: |
          docker run \
            --rm \
            --shm-size=64g \
            --workdir /workspace \
            --volume "$PWD:/workspace" \
            --volume "$GITHUB_ENV:$GITHUB_ENV" \
            -e PIP_CONSTRAINT= \
            -e GITHUB_ENV="$GITHUB_ENV" \
            -e CXX11_ABI="$CXX11_ABI" \
            -e MATRIX_TORCH_VERSION="$MATRIX_TORCH_VERSION" \
            -e WHEEL_CUDA_VERSION="$WHEEL_CUDA_VERSION" \
            -e MATRIX_PYTHON_VERSION="$MATRIX_PYTHON_VERSION" \
            "${CI_INPUTS_CONTAINER_IMAGE}" bash /workspace/build-scripts/.github/scripts/build.sh

      - name: Test wheels
        run: |
          docker run \
            --rm \
            --shm-size=64g \
            --workdir /workspace \
            --volume "$PWD:/workspace" \
            --volume "$GITHUB_ENV:$GITHUB_ENV" \
            -e GITHUB_ENV="$GITHUB_ENV" \
            "${CI_INPUTS_CONTAINER_IMAGE}" bash /workspace/build-scripts/.github/scripts/test.sh

        env:
          CI_INPUTS_CONTAINER_IMAGE: ${{ inputs.container-image }}
      - name: Log Built Wheels
        run: |
          ls dist

      - name: Attest container wheels
        if: inputs.upload-to-release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
      - if: inputs.upload-to-release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/*.whl
