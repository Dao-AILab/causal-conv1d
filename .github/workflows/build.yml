name: Build wheels

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "The runner to use for the build"
        required: true
        type: string
        default: ubuntu-22.04
      python-version:
        default: "3.15t"
        description: "The Python version to use for the build"
        required: true
        type: string
      cuda-version:
        default: "13.4.2"
        description: "The CUDA version to use for the build"
        required: true
        type: string
      torch-version:
        default: "2.14.1"
        description: "The PyTorch version to use for the build"
        required: true
        type: string
      cxx11_abi:
        default: "TRUE"
        description: "Enable torch flag C++11 ABI (TRUE/FALSE)"
        required: true
        type: string
      upload-to-release:
        description: "Upload wheel to this release"
        required: false
        type: boolean
        default: false
      release-version:
        description: "Upload wheel to this release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-wheels:
    permissions:
      id-token: write
      attestations: write
      contents: write
    uses: $/.github/workflows/_build.yml
    with:
      runs-on: ${{ inputs.runs-on || 'ubuntu-22.04' }}
      python-version: ${{ inputs.python-version || '3.15t' }}
      cuda-version: ${{ inputs.cuda-version || '13.4.2' }}
      torch-version: ${{ inputs.torch-version || '2.14.1' }}
      cxx11_abi: ${{ inputs.cxx11_abi || 'TRUE' }}
      upload-to-release: ${{ inputs.upload-to-release || false }}
      release-version: ${{ inputs.release-version }}
