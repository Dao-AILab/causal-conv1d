name: CUDA and PyTorch release advisory
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - name: Check official stable releases
        run: uv run --no-project .github/scripts/check_cuda_releases.py .github/workflows/build.yml .github/workflows/wheels.yml
