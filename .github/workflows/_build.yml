name: Build CUDA wheel
on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      python-version:
        required: true
        type: string
      cuda-version:
        required: true
        type: string
      torch-version:
        required: true
        type: string
      torch-index:
        type: string
        default: cu132
      cxx11_abi:
        required: true
        type: string
      upload-to-release:
        type: boolean
      release-version:
        type: string
jobs:
  build-wheel:
    permissions:
      contents: read
    # CUDA 12 needs the Visual Studio 2022 runner image.
    runs-on: ${{ inputs.runs-on == 'windows-2025' && startsWith(inputs.cuda-version, '12.') && 'windows-2022' || inputs.runs-on }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-version }}
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          activate-environment: true
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
          vsversion: ${{ startsWith(inputs.cuda-version, '12.') && '2022' || '' }}
      # The CUDA action's Windows download table predates CUDA 13.4.
      - name: Install CUDA on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CUDA_VERSION: ${{ inputs.cuda-version }}
        run: |
          $minor = ($env:CUDA_VERSION -split '\.')[0..1] -join '.'
          $installer = Join-Path $env:RUNNER_TEMP 'cuda.exe'
          $arch = if ([version]$env:CUDA_VERSION -ge [version]'13.4') { '_x86_64' } else { '' }
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_$($env:CUDA_VERSION)_windows$($arch)_network.exe" -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'NVIDIA') { throw 'Invalid NVIDIA installer signature' }
          $packages = "-s nvcc_$minor cudart_$minor thrust_$minor"
          if ([version]$env:CUDA_VERSION -ge [version]'13.0') { $packages += " crt_$minor nvvm_$minor" }
          $process = Start-Process $installer -ArgumentList $packages -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA installer failed: $($process.ExitCode)" }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$minor"
          "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          "DISTUTILS_USE_SDK=1" >> $env:GITHUB_ENV
          "$cudaPath\bin" >> $env:GITHUB_PATH
          Remove-Item $installer
      - name: Install CUDA on Linux
        if: runner.os == 'Linux'
        env:
          CUDA_VERSION: ${{ inputs.cuda-version }}
        run: |
          arch=$(uname -m)
          if [[ "$arch" == aarch64 ]]; then arch=sbsa; fi
          distro=$(lsb_release -sr)
          repo="https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${distro//./}/$arch"
          curl -fsSL "$repo/cuda-keyring_1.1-1_all.deb" -o "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get -o Acquire::Retries=3 update || { sleep 30; sudo apt-get -o Acquire::Retries=3 update; }
          minor=$(cut -d. -f1,2 <<< "$CUDA_VERSION")
          sudo apt-get install -y "cuda-minimal-build-${minor//./-}"
          echo "CUDA_HOME=/usr/local/cuda-$minor" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-$minor/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies and matching PyTorch wheel
        env:
          TORCH_VERSION: ${{ inputs.torch-version }}
          TORCH_BACKEND: ${{ inputs.torch-index }}
        run: |
          uv pip install --group build --upgrade --no-sources --torch-backend "$TORCH_BACKEND" "torch==$TORCH_VERSION"
          nvcc --version
      - name: Build wheel
        env:
          CAUSAL_CONV1D_FORCE_BUILD: "TRUE"
          CAUSAL_CONV1D_FORCE_CXX11_ABI: ${{ inputs.cxx11_abi }}
          TORCH_VERSION: ${{ inputs.torch-version }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          import torch
          suffix = f"cu{torch.version.cuda.split('.')[0]}torch{'.'.join(os.environ['TORCH_VERSION'].split('.')[:2])}cxx11abi{str(torch._C._GLIBCXX_USE_CXX11_ABI).upper()}"
          os.environ["CAUSAL_CONV1D_LOCAL_VERSION"] = suffix
          subprocess.run([sys.executable, "-m", "build", "--wheel", "--no-isolation", "--outdir", "dist"], check=True)
          for wheel in Path('dist').glob('*.whl'):
              package, version, tags = wheel.name.split('-', 2)
              version = version.split('+', 1)[0]
              wheel.rename(wheel.with_name(f"{package}-{version}+{suffix}-{tags}"))
          PY
      - name: Report Linux wheel compatibility
        if: runner.os == 'Linux'
        run: |
          for wheel in dist/*.whl; do
            python -m auditwheel show "$wheel"
          done
      - name: Test native extension import
        run: |
          uv pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -W error::RuntimeWarning -c "import sys, sysconfig, torch, causal_conv1d_cuda; assert not sysconfig.get_config_var('Py_GIL_DISABLED') or not sys._is_gil_enabled()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ inputs.runs-on }}-${{ inputs.python-version }}-${{ inputs.cuda-version }}-${{
            inputs.torch-version }}
          path: dist/*.whl
          if-no-files-found: error
  upload-release:
    if: inputs.upload-to-release
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ inputs.runs-on }}-${{ inputs.python-version }}-${{ inputs.cuda-version }}-${{ inputs.torch-version }}
          path: dist
      - name: Attest distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-version }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --clobber
